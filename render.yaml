services:
  - type: web
    name: smdapp
    runtime: docker
    plan: free
    dockerfilePath: Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        value: file:/tmp/custom.db
      - key: NEXT_TELEMETRY_DISABLED
        value: 1
      # Add your API keys in Render Dashboard → Environment tab
      # BREEZE_API_KEY, BREEZE_SECRET_KEY, BREEZE_SESSION_TOKEN
      # TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
      # GROQ_API_KEY, OPENROUTER_API_KEY, TOKENRA_API_KEY
    healthCheckPath: /api/health
    autoDeploy: true
