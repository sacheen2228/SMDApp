<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zero Hero Live Terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0E13; --panel:#111823; --panel-alt:#161F2C; --border:#232E3D; --border-soft:#1B2531;
    --text:#E9EEF3; --text-dim:#8A97A8; --text-faint:#4E5A6B;
    --ce:#33C98D; --ce-dim:#1E4A3B; --pe:#F0566B; --pe-dim:#4A2229;
    --amber:#E3A23D; --amber-dim:#3D3220; --cyan:#4FB3E8;
    --mono:'IBM Plex Mono',monospace; --display:'Space Grotesk',sans-serif; --ui:'Inter',sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--ui);}
  .app{max-width:1400px;margin:0 auto;padding:20px 16px 60px;}
  .topbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:16px;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand .mark{width:30px;height:30px;border-radius:7px;background:linear-gradient(135deg,var(--cyan),var(--ce));display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;color:#06141A;font-size:14px;}
  .brand h1{font-family:var(--display);font-size:17px;font-weight:600;margin:0;}
  .brand .sub{font-size:11px;color:var(--text-faint);font-family:var(--mono);}
  .tabs{display:flex;gap:6px;background:var(--panel);border:1px solid var(--border);border-radius:9px;padding:3px;flex-wrap:wrap;}
  .tab-btn{border:none;background:transparent;color:var(--text-dim);font-family:var(--display);font-size:12px;font-weight:600;padding:6px 14px;border-radius:6px;cursor:pointer;}
  .tab-btn.active{background:var(--cyan);color:#06141A;}
  .tab-btn:hover:not(.active){background:var(--panel-alt);}
  .live-badge{display:flex;align-items:center;gap:6px;background:var(--ce-dim);border:1px solid #1E4A3B;color:var(--ce);font-family:var(--mono);font-size:11px;font-weight:600;padding:5px 10px;border-radius:7px;}
  .live-badge.stale{background:var(--pe-dim);border-color:#6B2A34;color:var(--pe);}
  .live-badge .dot{width:6px;height:6px;border-radius:50%;background:currentColor;}
  .pulse{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;}
  .chip{background:var(--panel);border:1px solid var(--border);border-radius:9px;padding:8px 14px;min-width:100px;flex:1 1 100px;}
  .chip .label{font-size:9px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.6px;margin-bottom:3px;}
  .chip .value{font-family:var(--mono);font-size:16px;font-weight:600;}
  .banner{display:flex;align-items:flex-start;gap:12px;border-radius:9px;padding:12px 16px;margin-bottom:12px;border:1px solid;}
  .banner .ico{font-size:20px;flex-shrink:0;margin-top:2px;}
  .banner b{font-size:13px;}
  .banner p{margin:4px 0 0;font-size:12px;color:var(--text-dim);line-height:1.4;}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:14px;}
  .panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .panel-head h2{font-family:var(--display);font-size:13px;font-weight:600;margin:0;}
  .panel-head .tag{font-size:10px;font-family:var(--mono);color:var(--text-faint);}
  .table-wrap{overflow-x:auto;}
  table{border-collapse:collapse;width:100%;min-width:900px;}
  th{font-size:10px;font-weight:600;text-transform:uppercase;color:var(--text-faint);padding:6px 8px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--border);}
  td{font-family:var(--mono);font-size:12px;padding:6px 8px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--border-soft);}
  .col-strike{text-align:center !important;font-family:var(--display);font-weight:600;background:var(--panel-alt);}
  tr.atm-row td{background:rgba(227,162,61,.07);}
  tr.atm-row .col-strike{background:var(--amber-dim);color:var(--amber);}
  .oi-up{color:var(--ce);} .oi-down{color:var(--pe);}
  .greek-g{color:var(--cyan);} .greek-t{color:var(--pe);opacity:.85;}
  .buildup{font-size:10px;font-family:var(--mono);padding:2px 5px;border-radius:4px;white-space:nowrap;}
  .buildup.Long-Buildup{background:var(--ce-dim);color:var(--ce);}
  .buildup.Short-Covering{background:var(--ce-dim);color:var(--ce);opacity:.8;}
  .buildup.Short-Buildup{background:var(--pe-dim);color:var(--pe);}
  .buildup.Long-Unwinding{background:var(--pe-dim);color:var(--pe);opacity:.8;}
  .buildup.\2014{background:transparent;color:var(--text-faint);}
  .basis-col{text-align:left;font-family:var(--ui);font-size:11px;color:var(--text-dim);white-space:normal;max-width:240px;line-height:1.3;}
  .error-box{background:var(--pe-dim);border:1px solid #6B2A34;border-radius:9px;padding:14px;color:#F0C9CE;font-size:13px;font-family:var(--mono);white-space:pre-wrap;}
  footer{text-align:center;font-size:11px;color:var(--text-faint);font-family:var(--mono);margin-top:24px;line-height:1.6;}
  @media(max-width:600px){
    .chip .value{font-size:13px;}
    .tabs .tab-btn{font-size:10px;padding:4px 8px;}
  }
</style>
</head>
<body>
<div class="app" id="app">Loading…</div>
<script>
const INDICES = ["NIFTY","BANKNIFTY","FINNIFTY","MIDCPNIFTY","SENSEX"];
let currentIndex = "NIFTY";

function fmtOi(v){ return (v/100000).toFixed(1)+"L"; }
function fmtChg(v){ return (v>=0?"+":"")+(v/100000).toFixed(1)+"L"; }

function renderLevelAlert(d){
  if (d.spot > d.resistance){
    return `<div class="banner" style="background:var(--ce-dim);border-color:#1E4A3B;"><div class="ico">📈</div><div><b style="color:var(--ce)">Spot above resistance (${d.resistance.toLocaleString('en-IN')})</b><p>Textbook breakout — verify volume/OI shift before treating as real. False breakouts on index options are common.</p></div></div>`;
  }
  if (d.spot < d.support){
    return `<div class="banner"><div class="ico">📉</div><div><b>Spot below support (${d.support.toLocaleString('en-IN')})</b><p>Textbook breakdown — verify before acting. False breakdowns are common.</p></div></div>`;
  }
  if (d.expected_move && d.spot >= d.expected_move.upper){
    return `<div class="banner" style="background:var(--amber-dim);border-color:#5C4A22;"><div class="ico">⚠️</div><div><b style="color:var(--amber)">Spot at/past straddle-implied upper range</b><p>Market pricing didn't expect this level before expiry — far-side premiums may be reflecting it.</p></div></div>`;
  }
  if (d.expected_move && d.spot <= d.expected_move.lower){
    return `<div class="banner" style="background:var(--amber-dim);border-color:#5C4A22;"><div class="ico">⚠️</div><div><b style="color:var(--amber)">Spot at/past straddle-implied lower range</b><p>Market pricing didn't expect this level before expiry.</p></div></div>`;
  }
  return `<div class="banner" style="background:var(--panel-alt);border-color:var(--border);"><div class="ico">↔️</div><div><b style="color:var(--text-dim)">Spot inside support/resistance & expected move</b><p>No breakout/breakdown condition detected.</p></div></div>`;
}

async function loadData(){
  const el = document.getElementById('app');
  try{
    const res = await fetch(`/api/chain/${currentIndex}`);
    const d = await res.json();
    if(d.error){ renderError(d.error); return; }
    renderDashboard(d);
  }catch(err){
    renderError("Backend unreachable: " + err.message);
  }
}

function renderError(msg){
  document.getElementById('app').innerHTML = `
    <div class="topbar">
      <div class="brand"><div class="mark">ZH</div><div><h1>Zero Hero Live Terminal</h1><div class="sub">Connection error</div></div></div>
    </div>
    <div class="error-box">⚠ ${msg}\n\nCheck: is the Flask app running? Is SMDApp dev server on :3000?</div>
  `;
}

function renderDashboard(d){
  const maxOi = Math.max(...d.chain.map(r=>Math.max(r.ce.oi,r.pe.oi)));
  const fetchedAgoSec = (Date.now() - new Date(d.fetched_at)) / 1000;
  const stale = fetchedAgoSec > 30;

  document.getElementById('app').innerHTML = `
    <div class="topbar">
      <div class="brand">
        <div class="mark">ZH</div>
        <div><h1>Zero Hero Live Terminal</h1><div class="sub">via SMDApp · ${d.data_source} · data only, no signals</div></div>
      </div>
      <div class="tabs">
        ${INDICES.map(s => `<button class="tab-btn ${currentIndex===s?'active':''}" onclick="switchIndex('${s}')">${s}</button>`).join('')}
      </div>
      <div class="live-badge ${stale?'stale':''}"><span class="dot"></span>${stale?'STALE':'LIVE'} · ${Math.round(fetchedAgoSec)}s ago</div>
    </div>

    <div class="pulse">
      <div class="chip"><div class="label">${d.symbol} Spot</div><div class="value">${d.spot.toLocaleString('en-IN')}</div></div>
      <div class="chip"><div class="label">VIX</div><div class="value" style="color:var(--cyan)">${d.vix}</div></div>
      <div class="chip"><div class="label">PCR (full chain)</div><div class="value">${d.pcr}</div><div style="font-size:9px;color:var(--text-faint);margin-top:2px;">${d.chain_strike_count || '?'} strikes</div></div>
      <div class="chip"><div class="label">Max Pain</div><div class="value">${d.max_pain.toLocaleString('en-IN')}</div></div>
      <div class="chip"><div class="label">Resistance (max CE OI)</div><div class="value" style="color:var(--pe)">${d.resistance.toLocaleString('en-IN')}</div></div>
      <div class="chip"><div class="label">Support (max PE OI)</div><div class="value" style="color:var(--ce)">${d.support.toLocaleString('en-IN')}</div></div>
      <div class="chip"><div class="label">Expected Move (straddle)</div><div class="value" style="font-size:12px;">${d.expected_move.lower.toLocaleString('en-IN')}–${d.expected_move.upper.toLocaleString('en-IN')}</div></div>
      <div class="chip"><div class="label">Expiry</div><div class="value" style="font-size:13px;">${d.expiry}</div></div>
    </div>

    ${renderLevelAlert(d)}

    <div class="panel">
      <div class="panel-head"><h2>Option Chain — Live OI, IV & Greeks</h2><span class="tag">refreshes every 15s</span></div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th colspan="7" style="text-align:center;color:var(--ce);">CALLS (CE)</th>
              <th class="col-strike">STRIKE</th>
              <th colspan="7" style="text-align:center;color:var(--pe);">PUTS (PE)</th>
            </tr>
            <tr>
              <th>Θ</th><th>Γ</th><th>Δ</th><th>IV%</th><th>Chg OI</th><th>OI</th><th>LTP</th>
              <th class="col-strike"></th>
              <th>LTP</th><th>OI</th><th>Chg OI</th><th>IV%</th><th>Δ</th><th>Γ</th><th>Θ</th>
            </tr>
          </thead>
          <tbody>
            ${d.chain.map(r=>`
              <tr class="${r.atm?'atm-row':''}">
                <td class="greek-t">${r.ce.theta}</td>
                <td class="greek-g">${r.ce.gamma}</td>
                <td>${r.ce.delta}</td>
                <td>${r.ce.iv}</td>
                <td class="${r.ce.oi_chg>=0?'oi-up':'oi-down'}">${fmtChg(r.ce.oi_chg)}</td>
                <td>${fmtOi(r.ce.oi)}</td>
                <td>₹${r.ce.ltp.toFixed(2)}</td>
                <td class="col-strike">${r.strike.toLocaleString('en-IN')}</td>
                <td>₹${r.pe.ltp.toFixed(2)}</td>
                <td>${fmtOi(r.pe.oi)}</td>
                <td class="${r.pe.oi_chg>=0?'oi-up':'oi-down'}">${fmtChg(r.pe.oi_chg)}</td>
                <td>${r.pe.iv}</td>
                <td>${r.pe.delta}</td>
                <td class="greek-g">${r.pe.gamma}</td>
                <td class="greek-t">${r.pe.theta}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><h2>OI Buildup Read</h2><span class="tag">price vs OI direction</span></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th class="col-strike" style="text-align:center">Strike</th><th style="text-align:left">CE</th><th style="text-align:left">PE</th></tr></thead>
          <tbody>
            ${d.chain.map(r=>`
              <tr class="${r.atm?'atm-row':''}">
                <td class="col-strike">${r.strike.toLocaleString('en-IN')}</td>
                <td style="text-align:left"><span class="buildup ${r.ce.buildup.replace(/ /g,'-')}">${r.ce.buildup}</span></td>
                <td style="text-align:left"><span class="buildup ${r.pe.buildup.replace(/ /g,'-')}">${r.pe.buildup}</span></td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    </div>

    <div class="panel" id="scanner-panel">
      <div class="panel-head"><h2>Scanner — ${d.symbol}</h2><span class="tag">Δ/Γ projection to OI walls · ranked by OI</span></div>
      <div id="scanner-body" class="table-wrap">${renderScannerTable(d.scanner)}</div>
    </div>

    <footer>
      Data from SMDApp (NSE / BSE / ICICI Breeze) · Targets are Δ/Γ Taylor projections to OI walls — read the <i>basis</i> column for exact math ·
      SL is 2x daily theta decay · No trade recommendations · Verify independently before acting.
    </footer>
  `;
}

function renderScannerTable(scanner){
  if(!scanner || !scanner.length){
    return '<span style="color:var(--text-faint);font-family:var(--mono);font-size:12px;">No coherent risk/reward shape right now — try a different index or wait for price movement.</span>';
  }
  return `
    <table>
      <thead>
        <tr>
          <th style="text-align:left;">Strike / Type</th><th>OI</th><th>Entry</th><th>Δ</th><th>Γ</th><th>Θ</th>
          <th>Target</th><th>SL</th><th>R:R</th><th style="text-align:left;">Buildup</th><th style="text-align:left;">Basis</th>
        </tr>
      </thead>
      <tbody>
        ${scanner.map(r=>`
          <tr>
            <td style="text-align:left;"><span style="font-family:var(--display);font-weight:600;">${r.strike.toLocaleString('en-IN')}</span> <span style="font-family:var(--mono);font-size:11px;color:${r.type==='CE'?'var(--ce)':'var(--pe)'}">${r.type}</span></td>
            <td>${fmtOi(r.oi_rank)}</td>
            <td>₹${r.entry.toFixed(2)}</td>
            <td>${r.delta}</td>
            <td class="greek-g">${r.gamma}</td>
            <td class="greek-t">${r.theta}</td>
            <td class="oi-up">₹${r.target.toFixed(2)}</td>
            <td class="oi-down">₹${r.sl.toFixed(2)}</td>
            <td>${r.rr}</td>
            <td style="text-align:left"><span class="buildup ${r.buildup.replace(/ /g,'-')}">${r.buildup}</span></td>
            <td class="basis-col">${r.basis}</td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
}

function switchIndex(idx){
  currentIndex = idx;
  loadData();
}

loadData();
setInterval(loadData, 15000);
</script>
</body>
</html>
